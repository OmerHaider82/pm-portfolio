# GitHub Actions CI/CD workflow.
# Runs lint/test/build on every push and pull request targeting `main`,
# and—on pushes to `main` only—deploys the built site to AWS (S3 + CloudFront).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# OIDC needs id-token: write so the deploy job can mint a token to assume the
# AWS role; contents: read lets the runner check out the repo.
permissions:
  id-token: write
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest # the type of machine GitHub spins up for the job

    steps:
      # 1. Check out your repository code onto the runner.
      - name: Check out code
        uses: actions/checkout@v4

      # 2. Install Node.js. `cache: npm` speeds up future runs by reusing
      #    the downloaded packages.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 3. Install dependencies from the lockfile. `npm ci` is the
      #    CI-focused install: it's faster and fails if package.json and
      #    package-lock.json disagree, guaranteeing a reproducible build.
      - name: Install dependencies
        run: npm ci

      # 4. The actual checks. If any one exits non-zero, the job fails
      #    and GitHub marks the commit/PR with a red ✗.
      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # 5. Hand the built site off to the deploy job as an artifact so it
      #    publishes the exact bits we just tested.
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: ./dist

  # Deploy the built site to AWS. Runs only after `build` succeeds and only
  # on pushes to `main`, so pull requests still get lint/test/build but never
  # touch production.
  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      # Pull down the artifact the build job produced into ./dist.
      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: ./dist

      # Exchange the GitHub OIDC token for short-lived AWS credentials by
      # assuming the deploy role—no long-lived access keys stored anywhere.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::530732072836:role/github-deploy-role
          aws-region: us-east-2

      # Copy the site to S3. --delete removes files in the bucket that no
      # longer exist in the build, keeping the bucket in sync with ./dist.
      - name: Sync to S3
        run: aws s3 sync ./dist s3://pm-portfolio-site-omerhaider82 --delete

      # Bust the CloudFront cache so visitors get the new version right away.
      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id E23ID472W1WDLH --paths "/*"

  # Run the Playwright end-to-end tests on every pull request. This drives a
  # real browser against the production build, so it catches integration issues
  # the jsdom unit tests can't. It runs independently of `verify`/`deploy`, so a
  # failure here surfaces on the PR but never blocks the deploy to production.
  e2e:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Download the browser binaries Playwright drives, plus the OS libraries
      # they need on the runner.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # The Playwright config builds and serves the site itself (via webServer),
      # but we build here too so a build failure is reported as its own step.
      - name: Build
        run: npm run build

      - name: Run E2E tests
        run: npm run test:e2e

      # Always upload the HTML report so you can download and open it from the
      # run's Artifacts section — useful especially when a test failed.
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  # Audit the site with Lighthouse on every pull request. This job is purely
  # informational for now: assertions run in "warn" mode (see lighthouserc.json),
  # so low scores show up in the log but never turn the PR red or block merging.
  lighthouse:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Produce the real production bundle into ./dist. lhci serves these exact
      # files (via staticDistDir in lighthouserc.json) rather than the dev server.
      - name: Build
        run: npm run build

      # autorun = collect (serve dist + run Lighthouse 3x) → assert (warn) →
      # upload (temporary-public-storage). The job log prints a shareable report
      # URL you can open to see all four category scores.
      - name: Run Lighthouse CI
        run: npx lhci autorun
